<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carga Académica — División de Sistemas Productivos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:       #004b87;
  --blue-mid:   #1565c0;
  --blue-light: #e8f0fe;
  --green:      #2e7d32;
  --green-light:#e8f5e9;
  --amber:      #e65100;
  --amber-light:#fff3e0;
  --red:        #c62828;
  --red-light:  #ffebee;
  --gray-50:    #f9fafb;
  --gray-100:   #f3f4f6;
  --gray-200:   #e5e7eb;
  --gray-400:   #9ca3af;
  --gray-600:   #4b5563;
  --gray-800:   #1f2937;
  --white:      #ffffff;
  --radius-sm:  6px;
  --radius-md:  10px;
  --radius-lg:  16px;
  --shadow-sm:  0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 28px rgba(0,0,0,.10);
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--gray-100);
  color: var(--gray-800);
  min-height: 100vh;
}

/* ── LAYOUT ── */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  background: var(--blue);
  color: white;
  padding: 0 40px;
  height: 60px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.topbar-logo { font-size: 1rem; font-weight: 700; letter-spacing: -.3px; }
.topbar-div  { font-size: .78rem; opacity: .7; margin-left: 4px; }
.topbar-sep  { flex: 1; }

.main-wrap {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 300px;
  min-width: 300px;
  background: var(--white);
  border-right: 1px solid var(--gray-200);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--gray-200);
  background: var(--gray-50);
}
.sidebar-title {
  font-size: .75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--gray-400);
  margin-bottom: 10px;
}
.search-box {
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 8px 12px 8px 34px;
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  font-family: Arial, Helvetica, sans-serif;
  font-size: .85rem;
  background: var(--white);
  color: var(--gray-800);
  outline: none;
  transition: border-color .15s;
}
.search-box input:focus { border-color: var(--blue); }
.search-box .search-icon {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--gray-400);
  font-size: .85rem;
  pointer-events: none;
}
.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 10px;
}
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-track { background: transparent; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 4px; }

.prof-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background .12s, transform .12s;
  margin-bottom: 4px;
  border: 1.5px solid transparent;
}
.prof-item:hover   { background: var(--blue-light); border-color: #c5d8f8; }
.prof-item.active  { background: var(--blue-light); border-color: var(--blue); }
.prof-avatar {
  width: 38px; height: 38px; min-width: 38px;
  border-radius: 50%;
  background: var(--blue);
  color: white;
  font-weight: 700;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.prof-item.active .prof-avatar { background: var(--blue); }
.prof-info { flex: 1; min-width: 0; }
.prof-name  { font-size: .88rem; font-weight: 700; color: var(--gray-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prof-meta  { font-size: .74rem; color: var(--gray-400); margin-top: 2px; }
.prof-status {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--amber);
  flex-shrink: 0;
}
.prof-status.capturado { background: var(--green); }

.sidebar-empty {
  padding: 32px 20px;
  text-align: center;
  color: var(--gray-400);
  font-size: .85rem;
}

/* ── CONTENT AREA ── */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
  min-width: 0;
}
.content-area::-webkit-scrollbar { width: 6px; }
.content-area::-webkit-scrollbar-track { background: transparent; }
.content-area::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 4px; }

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 60vh;
  color: var(--gray-400);
  gap: 12px;
  text-align: center;
}
.empty-state i  { font-size: 3rem; opacity: .3; }
.empty-state p  { font-size: .95rem; }

/* ── PROF HEADER CARD ── */
.prof-header-card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 20px;
}
.prof-avatar-lg {
  width: 60px; height: 60px; min-width: 60px;
  border-radius: var(--radius-md);
  background: var(--blue);
  color: white;
  font-size: 1.5rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.prof-header-name {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--blue);
  line-height: 1.2;
}
.prof-header-sub {
  font-size: .8rem;
  color: var(--gray-400);
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.header-stats {
  margin-left: auto;
  display: flex;
  gap: 12px;
}
.stat-chip {
  text-align: center;
  background: var(--gray-50);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-md);
  padding: 10px 18px;
  min-width: 90px;
}
.stat-chip-val   { font-size: 1.2rem; font-weight: 700; color: var(--blue); }
.stat-chip-label { font-size: .68rem; color: var(--gray-400); text-transform: uppercase; letter-spacing: .4px; margin-top: 2px; }

/* ── SECTION ── */
.section-card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-lg);
  margin-bottom: 20px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.section-title {
  background: var(--gray-50);
  border-bottom: 1px solid var(--gray-200);
  padding: 14px 20px;
  font-size: .85rem;
  font-weight: 700;
  color: var(--blue);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .sec-action { margin-left: auto; }

/* ── TABLE ── */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: .85rem;
}
.tbl thead th {
  padding: 11px 14px;
  text-align: left;
  font-size: .72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--gray-400);
  border-bottom: 1px solid var(--gray-200);
  background: var(--gray-50);
  white-space: nowrap;
}
.tbl thead th.center { text-align: center; }
.tbl tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--gray-100);
  vertical-align: middle;
  color: var(--gray-800);
}
.tbl tbody td.center { text-align: center; }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr:hover td { background: var(--gray-50); }

.tag-prog {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: .7rem;
  font-weight: 700;
  background: var(--blue-light);
  color: var(--blue);
}
.hrs-val {
  font-size: .95rem;
  font-weight: 700;
  color: var(--blue);
}
.materia-name { font-weight: 600; font-size: .88rem; }
.materia-sub  { font-size: .75rem; color: var(--gray-400); margin-top: 2px; }

/* ── SUBTOTAL ROW ── */
.subtotal-bar {
  display: flex;
  gap: 0;
  border-top: 2px solid var(--gray-200);
  background: var(--gray-50);
}
.subtotal-item {
  flex: 1;
  padding: 12px 20px;
  border-right: 1px solid var(--gray-200);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.subtotal-item:last-child { border-right: none; }
.subtotal-label { font-size: .78rem; font-weight: 600; color: var(--gray-600); }
.subtotal-value { font-size: 1rem; font-weight: 700; color: var(--blue); }

/* ── ACTIVITIES TABLE ── */
.act-input {
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: .82rem;
  width: 100%;
  text-align: center;
  background: var(--white);
  color: var(--gray-800);
  outline: none;
  transition: border-color .15s;
}
.act-input:focus { border-color: var(--blue); }
.act-input[readonly] { background: var(--gray-100); color: var(--gray-600); cursor: default; }
.act-select {
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: .82rem;
  width: 100%;
  background: var(--white);
  color: var(--gray-800);
  outline: none;
  cursor: pointer;
}
.act-select:focus { border-color: var(--blue); }
.tbl tbody td.act-cell { padding: 7px 10px; }

.btn-del-act {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--gray-200);
  background: var(--white);
  color: var(--gray-400);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .85rem;
  transition: all .15s;
  margin: 0 auto;
}
.btn-del-act:hover { background: var(--red-light); border-color: #e57373; color: var(--red); }

/* ── BTN ADD ── */
.btn-add-act {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: Arial, Helvetica, sans-serif;
  font-size: .8rem;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s;
}
.btn-add-act:hover { background: #003a6b; }

/* ── RESUMEN / TOTALES ── */
.resumen-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--gray-200);
}
.resumen-cell {
  padding: 16px 20px;
  border-right: 1px solid var(--gray-100);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.resumen-cell:last-child { border-right: none; }
.resumen-cell-label { font-size: .7rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: .5px; }
.resumen-cell-val   { font-size: 1.05rem; font-weight: 700; color: var(--gray-800); }

.totales-bar {
  display: flex;
  background: var(--blue);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}
.totales-item {
  flex: 1;
  padding: 18px 24px;
  border-right: 1px solid rgba(255,255,255,.15);
}
.totales-item:last-child { border-right: none; }
.totales-label { font-size: .7rem; font-weight: 700; color: rgba(255,255,255,.65); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.totales-val   { font-size: 1.4rem; font-weight: 700; color: white; }
.totales-val.warn { color: #ffcc80; }

/* ── ESTADO EMPTY ── */
.act-empty {
  padding: 20px;
  text-align: center;
  font-size: .83rem;
  color: var(--gray-400);
}

/* ── BADGE ESTADO ── */
.badge-sin {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 20px; font-size: .7rem; font-weight: 700;
  background: var(--amber-light); color: var(--amber); border: 1px solid #ffcc80;
}
.badge-cap {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 20px; font-size: .7rem; font-weight: 700;
  background: var(--green-light); color: var(--green); border: 1px solid #a5d6a7;
}

/* ── SAVE BTN ── */
.save-bar {
  position: sticky;
  bottom: 0;
  background: var(--white);
  border-top: 1px solid var(--gray-200);
  padding: 14px 40px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  box-shadow: 0 -4px 12px rgba(0,0,0,.06);
}
.save-hint { font-size: .8rem; color: var(--gray-400); }
.btn-save {
  padding: 10px 28px;
  background: var(--blue);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  font-family: Arial, Helvetica, sans-serif;
  font-size: .88rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background .15s, transform .1s;
  box-shadow: 0 4px 12px rgba(0,75,135,.25);
}
.btn-save:hover  { background: #003a6b; transform: translateY(-1px); }
.btn-save:active { transform: translateY(0); }

/* ── PERIODO FILTER ── */
.periodo-filter {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px 14px;
  background: var(--gray-50);
  border-bottom: 1px solid var(--gray-200);
}
.periodo-filter label { font-size: .75rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; white-space: nowrap; }
.periodo-select {
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: .82rem;
  background: var(--white);
  color: var(--gray-800);
  outline: none;
  cursor: pointer;
  min-width: 220px;
}
.periodo-select:focus { border-color: var(--blue); }

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-left: 4px solid var(--green);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  box-shadow: var(--shadow-lg);
  font-size: .85rem;
  font-weight: 500;
  color: var(--gray-800);
  z-index: 9999;
  display: none;
  align-items: center;
  gap: 10px;
  max-width: 300px;
  animation: slideIn .25s ease;
}
@keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }

/* ── PERIODO BADGE ── */
.per-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: .72rem;
  font-weight: 700;
  background: #e8f0fe;
  color: var(--blue-mid);
  border: 1px solid #c5d8f8;
}

/* ── NO DATA BANNER ── */
.no-data-banner {
  background: var(--amber-light);
  border: 1px solid #ffe0b2;
  border-radius: var(--radius-md);
  padding: 16px 20px;
  margin-bottom: 24px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: .88rem;
}
.no-data-banner i { color: var(--amber); font-size: 1.1rem; margin-top: 1px; }

/* fade in */
.fade-in { animation: fadeUp .25s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<div class="app-shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <i class="bi bi-journal-bookmark-fill" style="font-size:1.2rem;opacity:.85;"></i>
    <div>
      <div class="topbar-logo">Carga Académica</div>
      <div class="topbar-div">División de Sistemas Productivos y Mantenimiento Industrial</div>
    </div>
    <div class="topbar-sep"></div>
    <div id="topPeriodoBadge" style="font-size:.78rem;opacity:.75;"></div>
  </div>

  <div class="main-wrap">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Profesores</div>
        <div class="search-box">
          <i class="bi bi-search search-icon"></i>
          <input type="text" id="searchProf" placeholder="Buscar profesor..." oninput="filtrarProfesores()">
        </div>
      </div>
      <!-- periodo filter -->
      <div class="periodo-filter">
        <label><i class="bi bi-funnel-fill me-1"></i>Periodo</label>
        <select class="periodo-select" id="selPeriodo" onchange="cargarDatos()">
          <option value="">Todos los periodos</option>
        </select>
      </div>
      <div class="sidebar-list" id="sidebarList">
        <div class="sidebar-empty">Cargando...</div>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content-area" id="contentArea">
      <div class="empty-state" id="emptyState">
        <i class="bi bi-person-lines-fill"></i>
        <p>Selecciona un profesor para ver su carga académica</p>
      </div>
      <div id="profView" style="display:none;" class="fade-in"></div>
    </div>

  </div>

  <!-- SAVE BAR -->
  <div class="save-bar" id="saveBar" style="display:none;">
    <span class="save-hint" id="saveHint">Los cambios se guardan automáticamente</span>
    <button class="btn-save" onclick="guardarActividades()">
      <i class="bi bi-floppy-fill"></i> Guardar actividades
    </button>
  </div>

</div>

<!-- TOAST -->
<div id="toast">
  <i class="bi bi-check-circle-fill" style="color:var(--green);"></i>
  <span id="toastMsg">Guardado</span>
</div>

<script>
// ── CONSTANTES ────────────────────────────────────────────────────────────────
const DIVISION_ID = 'sistemas_productivos';
const ACTIVIDADES_OPTS = [
  "Tutoría grupal","Asesoría académica","Investigación",
  "Gestión académica","Actividades de vinculación",
  "Estadías","Proyecto integrador","Otra"
];

// ── ESTADO ────────────────────────────────────────────────────────────────────
let profMap   = {};       // { nombreProf: { materias: [...] } }
let periodos  = [];
let profActivo= null;
let actAct    = [];       // actividades del profesor activo

// ── INIT ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  cargarDatos();
});

// ── LEER LOCALSTORAGE ─────────────────────────────────────────────────────────
function cargarDatos() {
  const registros = JSON.parse(localStorage.getItem('registrosResumenCargas')) || [];
  const completos = registros.filter(r => r.estado === 'completo' && r.division === DIVISION_ID);

  // periodos únicos
  periodos = [...new Set(completos.map(r => r.periodo))];
  const selPer = document.getElementById('selPeriodo');
  const actual = selPer.value;
  selPer.innerHTML = `<option value="">Todos los periodos</option>` +
    periodos.map(p => `<option value="${p}" ${p===actual?'selected':''}>${p}</option>`).join('');
  const periodoFiltro = selPer.value;

  // filtrar
  const filtrados = periodoFiltro
    ? completos.filter(r => r.periodo === periodoFiltro)
    : completos;

  // topbar badge
  document.getElementById('topPeriodoBadge').textContent =
    periodoFiltro ? periodoFiltro : (periodos.length ? periodos.join(' · ') : 'Sin datos');

  // construir profMap
  profMap = {};
  filtrados.forEach(reg => {
    reg.asignaciones.forEach(a => {
      reg.gruposRegistrados.forEach(g => {
        const prof = a[g];
        if (prof && prof !== '---') {
          if (!profMap[prof]) profMap[prof] = { materias: [] };
          profMap[prof].materias.push({
            materia: a.materia,
            grupo: g,
            carrera: reg.carrera,
            grado: reg.grado,
            periodo: reg.periodo,
            inicio: a.inicio,
            fin: a.fin,
            total: a.total,
            horas: a.horas || 5,
            programa: a.programa || 'LIC'
          });
        }
      });
    });
  });

  renderSidebar(Object.keys(profMap));

  // si había prof activo, re-renderizar
  if (profActivo && profMap[profActivo]) {
    abrirProfesor(profActivo);
  } else if (profActivo) {
    profActivo = null;
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('profView').style.display = 'none';
    document.getElementById('saveBar').style.display = 'none';
  }
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
function renderSidebar(profs) {
  const list = document.getElementById('sidebarList');
  if (!profs.length) {
    list.innerHTML = `<div class="sidebar-empty"><i class="bi bi-inbox" style="font-size:2rem;display:block;margin-bottom:8px;"></i>No hay profesores con asignaciones confirmadas en este periodo.</div>`;
    return;
  }
  const profActividades = JSON.parse(localStorage.getItem('actividadesProfesores')) || {};
  list.innerHTML = profs.map(n => {
    const tieneAct  = (profActividades[n] || []).length > 0;
    const inicial   = n.charAt(0).toUpperCase();
    const mats      = profMap[n].materias.length;
    const esActivo  = n === profActivo;
    return `
    <div class="prof-item ${esActivo?'active':''}" onclick="abrirProfesor('${n.replace(/'/g,"\\'")}')" id="pi_${encodeId(n)}">
      <div class="prof-avatar">${inicial}</div>
      <div class="prof-info">
        <div class="prof-name">${n}</div>
        <div class="prof-meta">${mats} materia${mats!==1?'s':''} asignada${mats!==1?'s':''}</div>
      </div>
      <div class="prof-status ${tieneAct?'capturado':''}"></div>
    </div>`;
  }).join('');
}

function filtrarProfesores() {
  const q = document.getElementById('searchProf').value.toLowerCase();
  const profs = Object.keys(profMap).filter(n => n.toLowerCase().includes(q));
  renderSidebar(profs);
}

function encodeId(str) {
  return str.replace(/[^a-zA-Z0-9]/g,'_');
}

// ── ABRIR PROFESOR ────────────────────────────────────────────────────────────
function abrirProfesor(nombre) {
  profActivo = nombre;
  const datos   = profMap[nombre] || { materias:[] };
  const materias= datos.materias;
  const profActividades = JSON.parse(localStorage.getItem('actividadesProfesores')) || {};
  actAct = JSON.parse(JSON.stringify(profActividades[nombre] || []));

  // sidebar highlight
  document.querySelectorAll('.prof-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`pi_${encodeId(nombre)}`);
  if (el) el.classList.add('active');

  // totales docencia
  const totalHrsDoc  = materias.reduce((s,m) => s + (m.horas||5), 0);
  const maxSems      = materias.reduce((mx,m) => Math.max(mx, m.total||0), 0);

  // periodos únicos del prof
  const perUnicos = [...new Set(materias.map(m=>m.periodo))];

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('profView').style.display   = 'block';
  document.getElementById('saveBar').style.display    = 'flex';

  // NO DATA check
  let noDataBanner = '';
  if (materias.length === 0) {
    noDataBanner = `<div class="no-data-banner"><i class="bi bi-exclamation-triangle-fill"></i><span>Este profesor no tiene materias asignadas en el periodo seleccionado.</span></div>`;
  }

  document.getElementById('profView').innerHTML = `
    ${noDataBanner}
    <!-- HEADER -->
    <div class="prof-header-card fade-in">
      <div class="prof-avatar-lg">${nombre.charAt(0)}</div>
      <div>
        <div class="prof-header-name">${nombre}</div>
        <div class="prof-header-sub">
          <i class="bi bi-building" style="font-size:.75rem;"></i>
          División de Sistemas Productivos y Mantenimiento Industrial
        </div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
          ${perUnicos.map(p=>`<span class="per-badge">${p}</span>`).join('')}
        </div>
      </div>
      <div class="header-stats">
        <div class="stat-chip">
          <div class="stat-chip-val" id="hStatHrs">${totalHrsDoc}</div>
          <div class="stat-chip-label">Hrs Doc</div>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-val" id="hStatSem">${maxSems}</div>
          <div class="stat-chip-label">Sem Doc</div>
        </div>
        <div class="stat-chip">
          <div class="stat-chip-val" id="hStatAct">0</div>
          <div class="stat-chip-label">Hrs Otras</div>
        </div>
        <div class="stat-chip" style="background:var(--blue);border-color:var(--blue);">
          <div class="stat-chip-val" id="hStatTotal" style="color:white;">—</div>
          <div class="stat-chip-label" style="color:rgba(255,255,255,.65);">Total Lab</div>
        </div>
      </div>
    </div>

    <!-- MATERIAS -->
    <div class="section-card fade-in">
      <div class="section-title"><i class="bi bi-book-half"></i>Materias Asignadas</div>
      <div style="overflow-x:auto;">
        <table class="tbl">
          <thead>
            <tr>
              <th>Asignatura</th>
              <th>Grupo</th>
              <th class="center">Prog</th>
              <th class="center">Hrs</th>
              <th class="center">Sem Inicio</th>
              <th class="center">Sem Fin</th>
              <th class="center">Total Sem</th>
            </tr>
          </thead>
          <tbody>
            ${materias.length ? materias.map(m => `
            <tr>
              <td>
                <div class="materia-name">${m.materia}</div>
                <div class="materia-sub">${m.carrera}</div>
              </td>
              <td><strong>${m.grupo}</strong></td>
              <td class="center"><span class="tag-prog">${m.programa}</span></td>
              <td class="center"><span class="hrs-val">${m.horas||5}</span></td>
              <td class="center">${m.inicio}</td>
              <td class="center">${m.fin}</td>
              <td class="center"><strong>${m.total}</strong></td>
            </tr>`).join('') : `<tr><td colspan="7" class="act-empty">Sin materias asignadas.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="subtotal-bar">
        <div class="subtotal-item">
          <span class="subtotal-label"><i class="bi bi-clock" style="margin-right:5px;"></i>Total Hrs Docencia</span>
          <span class="subtotal-value">${totalHrsDoc} hrs</span>
        </div>
        <div class="subtotal-item">
          <span class="subtotal-label"><i class="bi bi-calendar3" style="margin-right:5px;"></i>Total Semanas Docencia</span>
          <span class="subtotal-value">${maxSems} sem</span>
        </div>
      </div>
    </div>

    <!-- OTRAS ACTIVIDADES -->
    <div class="section-card fade-in">
      <div class="section-title">
        <i class="bi bi-clipboard-plus"></i>Otras Actividades
        <div class="sec-action">
          <button class="btn-add-act" onclick="agregarActividad()">
            <i class="bi bi-plus-lg"></i>Agregar actividad
          </button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="tbl" id="tblActividades">
          <thead>
            <tr>
              <th style="width:32%;">Actividad</th>
              <th class="center" style="width:10%;">Horas</th>
              <th class="center" style="width:13%;">Sem Inicio</th>
              <th class="center" style="width:13%;">Sem Fin</th>
              <th class="center" style="width:13%;">Total Sem</th>
              <th class="center" style="width:8%;"></th>
            </tr>
          </thead>
          <tbody id="tbodyAct"></tbody>
        </table>
      </div>
    </div>

    <!-- RESUMEN -->
    <div class="section-card fade-in" style="margin-bottom:40px;">
      <div class="section-title"><i class="bi bi-bar-chart-line-fill"></i>Resumen de Carga</div>
      <div class="resumen-grid">
        <div class="resumen-cell">
          <span class="resumen-cell-label">Total Sem. Docencia</span>
          <span class="resumen-cell-val" id="rSemDoc">${maxSems} sem</span>
        </div>
        <div class="resumen-cell">
          <span class="resumen-cell-label">Total Hrs Docencia</span>
          <span class="resumen-cell-val" id="rHrsDoc">${totalHrsDoc} hrs</span>
        </div>
        <div class="resumen-cell">
          <span class="resumen-cell-label">Total Hrs Otras Act.</span>
          <span class="resumen-cell-val" id="rHrsAct">0 hrs</span>
        </div>
      </div>
      <div class="totales-bar">
        <div class="totales-item">
          <div class="totales-label">Total Horas Laborales</div>
          <div class="totales-val" id="rTotalHrs">${totalHrsDoc} hrs</div>
        </div>
        <div class="totales-item">
          <div class="totales-label">Total Semanas Laborales</div>
          <div class="totales-val" id="rTotalSem">${maxSems} sem</div>
        </div>
      </div>
    </div>
  `;

  renderActividades();
  recalcularTotales();
}

// ── ACTIVIDADES ───────────────────────────────────────────────────────────────
function renderActividades() {
  const tbody = document.getElementById('tbodyAct');
  if (!tbody) return;
  if (!actAct.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="act-empty">Sin otras actividades. Usa "Agregar actividad" para añadir.</td></tr>`;
    return;
  }
  tbody.innerHTML = actAct.map((a, i) => {
    const opts = ACTIVIDADES_OPTS.map(o => `<option value="${o}" ${a.tipo===o?'selected':''}>${o}</option>`).join('');
    return `
    <tr id="actRow${i}">
      <td class="act-cell"><select class="act-select" onchange="updAct(${i},'tipo',this.value)">${opts}</select></td>
      <td class="act-cell"><input type="number" class="act-input" min="0" value="${a.horas||''}" placeholder="0" oninput="updAct(${i},'horas',this.value)"></td>
      <td class="act-cell"><input type="number" class="act-input" min="1" max="18" value="${a.inicio||''}" placeholder="1" oninput="updAct(${i},'inicio',this.value)"></td>
      <td class="act-cell"><input type="number" class="act-input" min="1" max="18" value="${a.fin||''}" placeholder="14" oninput="updAct(${i},'fin',this.value)"></td>
      <td class="act-cell"><input type="number" class="act-input" readonly value="${a.totalSem||''}" placeholder="—"></td>
      <td class="act-cell center"><button class="btn-del-act" onclick="elimAct(${i})"><i class="bi bi-trash3"></i></button></td>
    </tr>`;
  }).join('');
}

function agregarActividad() {
  actAct.push({ tipo: ACTIVIDADES_OPTS[0], horas:'', inicio:'', fin:'', totalSem:'' });
  renderActividades();
  recalcularTotales();
}

function updAct(i, campo, val) {
  if (!actAct[i]) return;
  actAct[i][campo] = val;
  const ini = parseInt(actAct[i].inicio);
  const fin = parseInt(actAct[i].fin);
  if (!isNaN(ini) && !isNaN(fin) && fin >= ini) {
    actAct[i].totalSem = fin - ini + 1;
    const row = document.getElementById(`actRow${i}`);
    if (row) {
      const totalInput = row.querySelectorAll('input[type=number]')[2];
      if (totalInput) totalInput.value = actAct[i].totalSem;
    }
  }
  recalcularTotales();
}

function elimAct(i) {
  actAct.splice(i, 1);
  renderActividades();
  recalcularTotales();
}

// ── TOTALES ───────────────────────────────────────────────────────────────────
function recalcularTotales() {
  const hrsDoc  = parseInt(document.getElementById('hStatHrs')?.textContent) || 0;
  const semDoc  = parseInt(document.getElementById('hStatSem')?.textContent) || 0;
  const hrsAct  = actAct.reduce((s,a) => s + (parseInt(a.horas)||0), 0);
  const maxSemsAct = actAct.reduce((mx,a) => Math.max(mx, parseInt(a.totalSem)||0), 0);
  const totalHrs  = hrsDoc + hrsAct;
  const totalSems = Math.max(semDoc, maxSemsAct);

  const set = (id, val) => { const el=document.getElementById(id); if(el) el.textContent=val; };
  set('hStatAct',  hrsAct);
  set('hStatTotal',totalHrs + ' hrs');
  set('rHrsAct',   hrsAct + ' hrs');
  set('rTotalHrs', totalHrs + ' hrs');
  set('rTotalSem', totalSems + ' sem');

  const rTSem = document.getElementById('rTotalSem');
  if (rTSem) rTSem.className = `totales-val${totalSems > 0 && totalSems < 15 ? ' warn' : ''}`;
}

// ── GUARDAR ───────────────────────────────────────────────────────────────────
function guardarActividades() {
  if (!profActivo) return;
  const profActs = JSON.parse(localStorage.getItem('actividadesProfesores')) || {};
  profActs[profActivo] = actAct;
  localStorage.setItem('actividadesProfesores', JSON.stringify(profActs));
  toast('Actividades guardadas correctamente');
  renderSidebar(Object.keys(profMap));
  // re-highlight
  const el = document.getElementById(`pi_${encodeId(profActivo)}`);
  if (el) el.classList.add('active');
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.style.display = 'flex';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display='none'; }, 3000);
}
</script>
</body>
</html>
